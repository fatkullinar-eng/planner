<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планер — задачи и состояние</title>
  <meta name="description" content="Планировщик задач с дневником состояния, подсказками и статистикой.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
            <path d="M3 10h18M8 3v4M16 3v4"></path>
          </svg>
        </span>
        <span class="brand-name">Планер</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Разделы">
      <button class="tab is-active" data-view="today">Сегодня</button>
      <button class="tab" data-view="tasks">Задачи</button>
      <button class="tab" data-view="mood">Состояние</button>
      <button class="tab" data-view="stats">Статистика</button>
      <button class="tab" data-view="settings">Настройки</button>
    </nav>

    <main id="app" class="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
